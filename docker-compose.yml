version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fueltracker-db
    environment:
      POSTGRES_USER: fueluser
      POSTGRES_PASSWORD: fuelpass
      POSTGRES_DB: fueltracker
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./packages/backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fueluser -d fueltracker"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
